<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>TRẠM ĐĂNG BÀI • Ngẫm Chuyện Đời</title>
  <link rel="icon" type="image/png" href="Avatar.png">
  <link rel="apple-touch-icon" href="Avatar.png">
  <meta name="theme-color" content="#090d16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-inner: #0d1322;
      --border: #1f293d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #f59e0b;
      --emerald: #10b981;
      --cyan: #06b6d4;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Plus Jakarta Sans", sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 10px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 520px; background: var(--card-bg); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.06); }

    /* HEADER */
    header { background: linear-gradient(180deg, rgba(245, 158, 11, 0.16) 0%, rgba(17, 24, 39, 0) 100%); padding: 14px 16px 10px 16px; text-align: center; border-bottom: 1px solid var(--border); }
    .brand-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
    .brand-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
    .header-title { font-size: 19px; font-weight: 900; background: linear-gradient(135deg, #fbbf24, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.2px; }
    .header-subtitle { font-size: 11px; color: var(--text-muted); font-weight: 600; }

    /* 2 TAB SWITCHER */
    .tab-switcher { display: grid; grid-template-columns: 1fr 1fr; background: #090d16; margin: 10px 14px 4px 14px; border-radius: 14px; padding: 4px; border: 1px solid var(--border); gap: 6px; }
    .tab-btn { border: none; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 800; padding: 11px 8px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
    .tab-btn.active { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35); }
    .tab-btn.tab-img.active { background: linear-gradient(135deg, #06b6d4, #0891b2); color: #fff; box-shadow: 0 4px 12px rgba(6, 182, 212, 0.35); }

    /* STATS & PROGRESS */
    .stats-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 2px 16px; font-size: 12px; color: var(--text-muted); font-weight: 700; }
    .progress-bar-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.06); border-radius: 6px; overflow: hidden; margin-top: 4px; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #f59e0b, #10b981); width: 0%; transition: width 0.3s; }

    /* ACTIVE CARD */
    .current-card { margin: 10px 14px 12px 14px; background: var(--card-inner); border: 1px solid var(--border); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    
    /* CARD HEADER */
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .stt-group { display: flex; align-items: center; gap: 8px; }
    .badge-stt { font-size: 12px; font-weight: 900; background: rgba(245, 158, 11, 0.2); color: #fbbf24; padding: 3px 9px; border-radius: 8px; border: 1px solid rgba(245, 158, 11, 0.35); font-family: 'JetBrains Mono', monospace; }
    .badge-category { font-size: 11px; font-weight: 700; color: var(--text-muted); max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .nav-buttons { display: flex; align-items: center; gap: 6px; }
    .btn-nav { background: #162035; border: 1px solid var(--border); color: #cbd5e1; font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
    .btn-nav:hover { background: #223150; color: #fff; }
    .btn-nav:active { transform: scale(0.95); }

    .current-title { font-size: 15.5px; font-weight: 800; color: #fff; line-height: 1.45; }

    /* 5-ROW ACTION BUTTONS GRID */
    .actions-grid { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .btn-row-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .btn-act { height: 42px; border: none; border-radius: 12px; padding: 0 10px; font-size: 12.5px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s; user-select: none; }
    .btn-act:active { transform: scale(0.97); }

    /* ROW 1: XEM DRIVE & TẢI DRIVE */
    .btn-view-drive { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.35); color: #38bdf8; }
    .btn-view-drive:hover { background: rgba(56, 189, 248, 0.25); }
    .btn-download-drive { background: rgba(16, 185, 129, 0.18); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
    .btn-download-drive:hover { background: rgba(16, 185, 129, 0.28); }

    /* ROW 2: CAPTION FB & BÌNH LUẬN */
    .btn-copy-fb { background: rgba(24, 119, 242, 0.18); border: 1px solid rgba(24, 119, 242, 0.45); color: #60a5fa; }
    .btn-copy-fb:hover { background: rgba(24, 119, 242, 0.28); }
    .btn-copy-pinned { background: rgba(168, 85, 247, 0.18); border: 1px solid rgba(168, 85, 247, 0.4); color: #c084fc; }
    .btn-copy-pinned:hover { background: rgba(168, 85, 247, 0.28); }

    /* ROW 3: CAPTION TIKTOK & CAPTION ZALO */
    .btn-copy-tiktok { background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.35); color: #fb7185; }
    .btn-copy-tiktok:hover { background: rgba(244, 63, 94, 0.25); }
    .btn-copy-zalo { background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.35); color: #38bdf8; }
    .btn-copy-zalo:hover { background: rgba(14, 165, 233, 0.25); }

    /* ROW 4: YOUTUBE TIÊU ĐỀ & MÔ TẢ (HOẶC INSTA & PROMPT AI Ở TAB ẢNH) */
    .btn-copy-yt-title { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.35); color: #fbbf24; }
    .btn-copy-yt-title:hover { background: rgba(245, 158, 11, 0.25); }
    .btn-copy-yt-desc { background: rgba(203, 213, 225, 0.1); border: 1px solid var(--border); color: #cbd5e1; }
    .btn-copy-yt-desc:hover { background: rgba(203, 213, 225, 0.18); }

    /* ROW 5: NÚT ĐÁNH DẤU ĐÃ ĐĂNG - FULL WIDTH, NỔI BẬT */
    .btn-mark-posted { width: 100%; height: 46px; border-radius: 13px; font-size: 13.5px; font-weight: 900; letter-spacing: 0.3px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; border: none; }
    .btn-mark-posted.state-pending { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35); }
    .btn-mark-posted.state-pending:hover { background: linear-gradient(135deg, #dc2626, #b91c1c); }
    .btn-mark-posted.state-done { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.45); color: #34d399; }
    .btn-mark-posted.state-done:hover { background: rgba(16, 185, 129, 0.3); }

    /* PREVIEW FRAME (DƯỚI 5 HÀNG NÚT, KÍCH THƯỚC BẰNG NHAU CHO CẢ VIDEO & ẢNH) */
    .preview-section { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .preview-header-label { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--text-muted); font-weight: 700; padding: 0 2px; }
    .preview-box { width: 100%; height: 260px; background: #050811; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
    .preview-box iframe { width: 100%; height: 100%; border: none; border-radius: 14px; }
    .preview-box img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
    .preview-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-muted); padding: 16px; text-align: center; }
    .preview-placeholder .icon { font-size: 38px; }
    .preview-placeholder .hint { font-size: 11.5px; color: #64748b; }

    /* LIST & SEARCH SECTION (DƯỚI CÙNG) */
    .list-section { padding: 12px 14px 16px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; background: rgba(11, 17, 32, 0.5); }
    .search-input { width: 100%; background: #090d16; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: #fff; outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--primary); }

    .filter-chips { display: flex; gap: 6px; overflow-x: auto; }
    .filter-chip { background: #090d16; border: 1px solid var(--border); color: var(--text-muted); font-size: 11.5px; font-weight: 800; padding: 6px 12px; border-radius: 18px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
    .filter-chip.active { background: var(--primary); color: #000; border-color: var(--primary); }
    .filter-chip.chip-pending.active { background: #ef4444; color: #fff; border-color: #ef4444; }
    .filter-chip.chip-done.active { background: #10b981; color: #000; border-color: #10b981; }

    .table-container { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; background: #090d16; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { background: #131d31; padding: 8px 10px; text-align: left; color: var(--text-muted); font-size: 11px; font-weight: 800; position: sticky; top: 0; border-bottom: 1px solid var(--border); }
    td { padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; vertical-align: middle; }
    tr:hover { background: rgba(255,255,255,0.04); }
    tr.active { background: rgba(245, 158, 11, 0.15); font-weight: 700; }
    .badge-status { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
    .badge-status.pending { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .badge-status.done { background: rgba(16, 185, 129, 0.2); color: #34d399; }

    /* TOAST */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: #000; font-weight: 900; font-size: 13px; padding: 10px 22px; border-radius: 20px; z-index: 999; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.6); }

    /* LIGHTBOX */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 14px; }
    .lightbox img { max-width: 100%; max-height: 92vh; border-radius: 12px; object-fit: contain; }
      .btn-copy-aff { background: rgba(234, 179, 8, 0.16); border: 1px solid rgba(234, 179, 8, 0.42); color: #fde047; }
    .btn-copy-aff:hover { background: rgba(234, 179, 8, 0.27); }
    .btn-link-aff { background: rgba(16, 185, 129, 0.16); border: 1px solid rgba(16, 185, 129, 0.42); color: #34d399; }
    .btn-link-aff:hover { background: rgba(16, 185, 129, 0.27); }
    .btn-mark-posted { width: 100%; height: 46px; border-radius: 13px; font-size: 13.5px; }
</style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="brand-wrap">
        <img src="Avatar.png" class="brand-avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%23f59e0b\'/><text x=\'50\' y=\'60\' font-size=\'40\' text-anchor=\'middle\' fill=\'white\'>PH</text></svg>'">
        <div>
          <h1 class="header-title">Ngẫm Chuyện Đời</h1>
          <div class="header-subtitle">Trạm Đăng Bài Mobile • Cả Video & Ảnh Dạy Con</div>
        </div>
      </div>
    </header>

    <!-- SWITCH 2 TAB CHÍNH -->
    <div class="tab-switcher">
      <button class="tab-btn active" id="tabVideoBtn" onclick="switchTab('video')">🎬 ĐĂNG VIDEO (<span id="vCount">0</span>)</button>
      <button class="tab-btn tab-img" id="tabImageBtn" onclick="switchTab('image')">📸 ĐĂNG ẢNH (<span id="iCount">0</span>)</button>
    </div>

    <!-- STATS & PROGRESS BAR -->
    <div class="stats-bar">
      <span id="statText">Đang tải...</span>
      <span id="statPercent">0%</span>
    </div>
    <div style="padding: 0 14px;"><div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div></div>

    <!-- ACTIVE CARD -->
    <div class="current-card">
      <div class="card-top">
        <div class="stt-group">
          <span class="badge-stt" id="currStt">#---</span>
          <span class="badge-category" id="currCategory">Phúc Học Điều Hay</span>
        </div>
        <div class="nav-buttons">
          <button class="btn-nav" onclick="prevItem()" title="Bài trước">⬅️ Trước</button>
          <button class="btn-nav" onclick="nextItem()" title="Bài tiếp theo">Sau ➡️</button>
        </div>
      </div>

      <div class="current-title" id="currTitle">Đang nạp bài viết...</div>

      <!-- 5 HÀNG NÚT BẤM CÂN XỨNG -->
      <div class="actions-grid">
        <!-- HÀNG 1: XEM DRIVE (TRÊN KHUNG XEM) & TẢI VỀ MÁY -->
        <div class="btn-row-2col">
          <button class="btn-act btn-view-drive" id="btnViewDrive" onclick="triggerViewInFrame()">
            <span>👁️ Xem Drive</span>
          </button>
          <button class="btn-act btn-download-drive" id="btnDownloadDrive" onclick="triggerDownloadDrive()">
            <span id="lblDownloadDrive">📥 Tải Drive</span>
          </button>
        </div>

        <!-- HÀNG 2: CAPTION FACEBOOK & BÌNH LUẬN -->
        <div class="btn-row-2col">
          <button class="btn-act btn-copy-fb" onclick="copyCurrentField('facebook', 'Caption Facebook')">
            <span>📘 Caption Facebook</span>
          </button>
          <button class="btn-act btn-copy-pinned" onclick="copyCurrentField('pinnedComment', 'Bình Luận')">
            <span>📌 Bình Luận</span>
          </button>
        </div>

        <!-- HÀNG 3: CAPTION TIKTOK & CAPTION ZALO -->
        <div class="btn-row-2col">
          <button class="btn-act btn-copy-tiktok" onclick="copyCurrentField('tiktok', 'Caption TikTok')">
            <span>🎵 Caption TikTok</span>
          </button>
          <button class="btn-act btn-copy-zalo" onclick="copyCurrentField('zalo', 'Caption Zalo')">
            <span>💬 Caption Zalo</span>
          </button>
        </div>

        <!-- HÀNG 4: CAPTION YOUTUBE & MÔ TẢ YOUTUBE (HOẶC INSTA & PROMPT AI Ở TAB ẢNH) -->
        <div class="btn-row-2col">
          <button class="btn-act btn-copy-yt-title" id="btnRow4Col1" onclick="copyRow4Col1()">
            <span id="lblRow4Col1">▶️ Caption YouTube</span>
          </button>
          <button class="btn-act btn-copy-yt-desc" id="btnRow4Col2" onclick="copyRow4Col2()">
            <span id="lblRow4Col2">📄 Mô Tả YouTube</span>
          </button>
        </div>

        <!-- HÀNG 5: NÚT ĐÁNH DẤU ĐÃ ĐĂNG - DÀI, MÀU ĐỎ NỔI BẬT -->
        <div class="btn-row-2col">
  <button class="btn-act btn-link-aff" id="btnCopyAffiliateLink" onclick="copyAffiliateLink()">
    <span>🔗 Link AFF</span>
  </button>
  <button class="btn-act btn-copy-aff" id="btnCopyAffiliate" onclick="copyAffiliateSuggestions()">
    <span>🛒 Gợi ý AFF</span>
  </button>
</div>
<button class="btn-mark-posted state-pending" id="btnMarkPosted" onclick="toggleCurrentDone()">
  <span id="lblMarkPosted">🔴 ĐÃ ĐĂNG BÀI</span>
</button>
      </div>

      <!-- KHUNG XEM TRỰC TIẾP VIDEO & ẢNH (ĐẶT DƯỚI 5 HÀNG NÚT, KÍCH THƯỚC BẰNG NHAU) -->
      <div class="preview-section">
        <div class="preview-header-label">
          <span id="previewTypeLabel">Khung Xem Trực Tiếp:</span>
          <span id="previewActionHint" style="font-size:11px;color:#38bdf8;cursor:pointer;" onclick="openDriveExternalTab()">Mở tab Drive ↗</span>
        </div>
        <div class="preview-box" id="previewMediaBox">
          <!-- Video Iframe hoặc Thẻ Img sẽ được render tại đây -->
        </div>
      </div>
    </div>

    <!-- LIST & SEARCH SECTION (DƯỚI CÙNG - MẶC ĐỊNH LỌC CHƯA ĐĂNG) -->
    <div class="list-section">
      <div class="filter-chips">
        <button class="filter-chip chip-pending active" id="chipPending" onclick="setFilter('pending')">⏳ Chưa đăng (<span id="countPending">0</span>)</button>
        <button class="filter-chip chip-done" id="chipDone" onclick="setFilter('done')">✅ Đã đăng (<span id="countDone">0</span>)</button>
        <button class="filter-chip" id="chipAll" onclick="setFilter('all')">Tất cả (<span id="countAll">0</span>)</button>
      </div>

      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Tìm theo STT (#1) hoặc từ khóa..." oninput="renderTable()">

      <div class="table-container">
        <table>
          <thead><tr><th style="width:46px;">STT</th><th>Tiêu đề bài viết</th><th style="width:75px;">Trạng thái</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg">✓ Đã sao chép!</div>
  <div class="lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" src=""></div>

  <script>
    var VIDEO_ITEMS = [{"stt":1,"category":"Đạo Lý Studio","title":"Audio (1)","status":"Đã đăng","videoUrl":"https://drive.google.com/file/d/1FmwnYEBf8KliR8N62uZiIZBP-UNzd36w/view?usp=drivesdk","youtubeTitle":"Lấy Chồng Xa: Con Đường Về Nhà Mẹ Đẻ Sao Mà Xa Xôi Đến Thế? | Bài Học Nhân Sinh","youtubeDesc":"Lấy chồng xa không chỉ là khoảng cách về địa lý, mà là khoảng cách của những nỗi niềm không tên. Khi gánh nặng cơm áo gạo tiền, chuyện con cái và trách nhiệm đè nặng, lời hứa 'muốn về là về' bỗng trở nên xa xỉ. \n\nVideo này chia sẻ về thực tế phũ phàng mà nhiều người phụ nữ đang phải đối mặt. Hy vọng mỗi chúng ta sẽ có cái nhìn sâu sắc hơn về tình cảm gia đình và sự tự chủ trong cuộc sống. \n\nĐừng quên Đăng ký kênh để theo dõi thêm nhiều bài học nhân sinh giá trị mỗi ngày nhé!","tiktok":"Đừng bao giờ tin câu 'Lấy chồng xa, muốn về là về'! 🛑 \n\nThực tế là: Không tiền không thể về, mang thai không thể về, con nhỏ lại càng không thể về. \n\nCuối cùng, đường về nhà mẹ đẻ lại là nơi xa nhất cuộc đời bạn. \n\nXem hết video này để thấu hiểu nỗi lòng của những người con xa xứ. Đừng quên để lại suy nghĩ của bạn dưới bình luận nhé! 💔 #laychongxa #baihocnhansinh #phunu #trending","facebook":"Có người nói: 'Lấy chồng xa, chỉ cần có phương tiện là về được'. Nhưng thực tế lại phũ phàng hơn thế nhiều. \r\n\r\nPhụ nữ à, trước khi chọn đi xa, hãy chuẩn bị cho mình một tinh thần và sự tự chủ vững vàng nhất có thể. \r\n\r\n#NgamChuyenDoi #BaiHocCuocDoi #LayChongXa #TamSuPhuNu #GiaDinh","zalo":"Gửi những người phụ nữ đang ở xa nhà: Đừng để con đường về với mẹ trở thành nơi xa nhất. Dù bận rộn đến đâu, hãy cố gắng thu xếp để trở về khi còn có thể, bởi thời gian không chờ đợi một ai. Một lời nhắn gửi chân thành đến chị em mình, hãy thương lấy chính mình và gia đình mình nhé.","instagram":"Con đường về nhà mẹ đẻ - Nơi gần nhất trong tim, nhưng lại xa nhất trong thực tế. Đừng để những lo toan khiến lối về trở nên mịt mù. ✨ \n\n#familygoals #lifequotes #womenpower #motivation #nhansinh" tTrienBanThan","tiktok":"Bạn có biết kẻ thù đôi khi lại do chính tay mình tạo ra không? Đừng để sự hiền lành và nhường nhịn biến bạn thành miếng mồi cho kẻ khác lấn tới. Xem hết video này để nhận ra 5 sai lầm khiến bạn rước họa vào thân từ chính lòng tốt của mình.\n\n#NgamChuyenDoi #BaiHocCuocDoi #PhatTrienBanThan #Song #Xuhuong","facebook":"Tử tế sai người là tự hại mình. Đừng để lòng tốt biến thành điểm yếu để kẻ khác lấn tới.\n\n#NgamChuyenDoi #BaiHoc #NhanSinh #CuocSong #TriTue","zalo":"Gửi bạn, lòng tốt là vốn quý nhưng hãy đặt đúng chỗ, đúng người. Đừng quá nuông chiều hay nhượng bộ kẻ không xứng đáng để rồi tự làm hại chính mình. Chúc bạn luôn tỉnh táo, mạnh mẽ và bình yên trong mọi mối quan hệ nhé.\n\n#NgamChuyenDoi","instagram":"Lòng tốt không có răng là sự nhu nhược. Hãy tử tế một cách trí tuệ và biết đặt ra ranh giới. ✨\n\n#NgamChuyenDoi #Wisdom #LifeLessons #Mindset #Boundaries","pinnedComment":"Bạn đã từng mất đi một mối quan hệ chỉ vì cho vay tiền hay quá nhường nhịn chưa? Hãy chia sẻ câu chuyện của bạn để chúng ta cùng rút kinh nghiệm nhé! Đừng quên ghé link bio/giỏ hàng để tìm những cuốn sách giúp bạn thấu hiểu nhân tâm và bảo vệ bản thân tốt hơn. #NgamChuyenDoi","affiliateSuggestions":"Sách Lòng Tốt Của Bạn Cần Thêm Đôi Phần Sắc Sảo - Mộ Nhan Ca\nSách Đắc Nhân Tâm - Dale Carnegie\nSách Đọc Vị Bất Kỳ Ai - David J. Lieberman\nSách Thiết Lập Ranh Giới - Nedra Glover Tawwab\nSách Khéo Ăn Nói Sẽ Có Được Thiên Hạ - Trác Nhã","productLink":""},{"stt":11,"category":"Đạo Lý Studio","title":"Audio (11)","status":"Đã đăng","videoUrl":"https://drive.google.com/file/d/17zReZyaT78HIvTSuWihxbqw2juuQUqLl/view?usp=drivesdk","youtubeTitle":"Đừng Để Đến Cửa Tử Mới Nhận Ra Thứ Quý Giá Nhất | Ngẫm Chuyện Đời","youtubeDesc":"Tiền nhiều đến mấy cũng không mua được sự sống, danh tiếng lớn đến đâu cũng không qua khỏi quy luật sinh tử. Chúng ta mải mê chạy theo phù hoa mà quên mất rằng nấm mồ lạnh lẽo là điểm đến cuối cùng của tất cả. Hãy cùng Ngẫm Chuyện Đời nhìn lại giá tr t5VVEvzJOYj-jq/view?usp=drivesdk","youtubeTitle":"9 Bài Học Nhân Sinh Đắt Giá: Dạy Con Sai Cách, Họa Đến Cận Kề | Ngẫm Chuyện Đời","youtubeDesc":"Cổ nhân dạy: 'Nuôi con trai không dạy như nuôi lửa, nuôi con gái không dạy như nuôi heo'. Phép tắc và nết ăn ở không chỉ là phép lịch sự, mà còn là phong thủy, là phúc đức của một người. Video này sẽ giúp bạn thấu hiểu những bài học sâu sắc về cách giáo dục con cái và tu dưỡng bản thân để giữ gìn phúc báo.\n\n#NgamChuyenDoi","tiktok":"Ba tuổi đánh mẹ thì cười, ba mươi tuổi đánh mẹ là cả một nỗi đau. Bạn có đang vô tình nuôi dạy một 'nghịch tử' vì quá nuông chiều? Từ nết ăn đến dáng ngồi, phúc đức một người đều nằm ở đó. Đừng bỏ lỡ giây nào trong video này để thấu hiểu những quy tắc ngầm cứu vãn tương lai con trẻ.\n\n#NgamChuyenDoi","facebook":"Dạy con từ thuở còn thơ, nết người từ thuở nằm nôi. Đừng để sự nuông chiều vô tình gieo mầm tai họa cho mai sau.\n\n#NgamChuyenDoi #BaiHocCuocDoi #DayCon #NhanSinh #TriTue","zalo":"Gửi cả nhà bài học quý về nết ăn, nếp ở và cách nuôi dạy con cái. 'Uốn cây từ thuở còn non', mong rằng những lời khuyên này sẽ giúp gia đình chúng ta thêm thuận hòa, con cháu hiếu thảo. Chúc mọi người bình an!\n\n#NgamChuyenDoi","instagram":"Nét đẹp của một người nằm ở giáo dưỡng. Tu thân tích đức từ những điều nhỏ nhất trong cách ăn ở. ✨\n\n#NgamChuyenDoi #SongCham #TriTue #NhanSinh #DaoLy","pinnedComment":"Trong những quy tắc trên, bạn thấy điều nào là quan trọng nhất đối với việc giáo dục con trẻ hiện nay? Hãy cùng chia sẻ góc nhìn nhé! Các sản phẩm rèn luyện tâm tính và nếp sống mình để ở link Bio, mời cả nhà ghé xem.","affiliateSuggestions":"Sách Phép Tắc Người Con (Đệ Tử Quy)\nSách Vô Cùng Tàn Nhẫn Vô Cùng Yêu Thương\nSách Nuôi Con Không Phải Là Cuộc Chiến\nBộ bát đĩa gốm sứ cao cấp rèn nếp ăn\nTượng chú tiểu tứ không gốm tử sa","productLink":""},{"stt":68,"category":"Đạo Lý Studio","title":"Video 68","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1BACUJYc7aaHKtKOjRInfJwjtxg0tcSdT/view?usp=drivesdk","youtubeTitle":"Đàn ông kiếm được 10 đồng cho vợ 9 đồng: Đỉnh cao của sự yêu thương | Ngẫm Chuyện Đời","youtubeDesc":"Phụ nữ không cần người quá giàu sang, chỉ mong tìm được người chồng biết nghĩ, sợ vợ mình thiệt thỏi mà không ngừng bù đắp. Tiền bạc có thể kiếm lại, nhưng tâm chân tình của người đàn ông dành cho vợ là vô giá. Cùng suy ngẫm về giá trị của sự hy sinh và yêu thương trong hôn nhân qua video này.\n\n#NgamChuyenDoi #HonNhan #GiaDinh #HanhPhuc #TamLy","tiktok":"Bí mật về người đàn ông 'cực phẩm' mà mọi phụ nữ đều tìm kiếm. Không phải giàu sang, mà là con số 9/10 này đây. Xem hết video để thấy mình có đang hạnh phúc không nhé chị em!\n\n#NgamChuyenDoi","facebook":"Phụ nữ hơn nhau ở tấm chồng, không phải ở số tiền anh có mà là cách anh ấy vì bạn mà bù đắp.\n\n#NgamChuyenDoi #HonNhan #GiaDinh #PhuNu #HanhPhuc","zalo":"Chẳng cần giàu sang phú quý, chỉ mong gặp được người biết thương, biết lo cho mình từng chút một. Phụ nữ chúng mình, hạnh phúc nhất là có người chồng luôn sợ mình thiệt thỏi. Gửi lời chúc bình an đến các chị em!\n\n#NgamChuyenDoi","instagram":"Hạnh phúc là khi anh có 10 đồng, và anh sẵn lòng trao em tất cả. 🕊️✨\n\n#NgamChuyenDoi #HonNhan #LoveQuotes #GiaDinh #Happiness","pinnedComment":"Trong thang điểm 10, người đàn ông của bạn đang dành cho bạn bao nhiêu 'đồng' sự quan tâm? Hãy chia sẻ câu chuyện của bạn bên dưới nhé! Đừng quên ghé giỏ hàng/link bio để chọn những món quà tinh tế tự thưởng cho bản thân mình nha. 👇","affiliateSuggestions":"Sách 5 Ngôn Ngữ Tình Yêu\nSách Đàn Ông Đến Từ Sao Hỏa Đàn Bà Đến Từ Sao Kim\nSách Phụ Nữ Thông Minh Không Ở Góc Bếp\nBộ quà tặng nến thơm thư giãn\nMáy xông tinh dầu tạo không gian ấm cúng","productLink":""},{"stt":69,"category":"Đạo Lý Studio","title":"Video 69","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1NSzXxPS8d6CWW-JjoZ4pEWF8i2osijzi/view?usp=drivesdk","youtubeTitle":"Người Duy Nhất Đi Cùng Bạn Đến Cuối Đời Không Phải Con Cái | Ngẫm Chuyện Đời","youtubeDesc":"Cha mẹ rồi sẽ già đi, con cái rồi sẽ có tổ ấm riêng. Chỉ có người bạn đời mới là người cùng bạn thức khuya dậy sớm, nắm tay bạn đi qua mọi giông bão cuộc đời. Đừng xem sự hy sinh của họ là hiển nhiên. Hãy cùng Ngẫm Chuyện Đời nhìn lại giá trị của tình phu thê sâu sắc qua video này nhé.\n\n#NgamChuyenDoi","tiktok":"Người ở bên bạn lâu nhất không phải là cha mẹ hay con cái... Bạn có biết đó là ai không? Hãy xem hết video này để nhận ra giá trị của người đang cùng bạn chung chăn sẻ gối. Đừng để khi mất đi mới thấy nuối tiếc.\n\n#NgamChuyenDoi #HonNhan #TrietLyCuocSong #GiaDinh #BaiHocCuocDoi","facebook":"Trân trọng người bạn đời - người đi cùng bạn đến cuối con đường.\n\n#NgamChuyenDoi #HonNhan #VoChong #GiaDinh #BaiHocCuocDoi","zalo":"Trong đời này, tìm được người thấu hiểu mình đã khó, cùng nhau đi đến bạc đầu lại càng khó hơn. Hãy dành một chút thời gian để quan tâm và biết ơn người bạn đời của mình nhé. Chúc gia đình bạn luôn ấm áp và hạnh phúc!\n\n#NgamChuyenDoi","instagram":"Tình phu thê: Yêu là học mỗi ngày, thấu hiểu là luyện từng giờ. Trân trọng người ở cạnh lúc ta yếu lòng nhất. ✨\n\n#NgamChuyenDoi #Love #Marriage #Mindset #Healing","pinnedComment":"Giữa hàng tỷ người, duyên nợ mới cho ta gặp được nhau. Bạn có đang trân trọng 'nửa kia' của mình không? Chia sẻ cảm xúc của bạn dưới đây nhé! Món quà tinh thần ý nghĩa dành cho gia đình tại link bio/giỏ hàng: #NgamChuyenDoi","affiliateSuggestions":"Sách 5 Ngôn Ngữ Tình Yêu - Gary Chapman\nSách Đàn Ông Đến Từ Sao Hỏa Đàn Bà Đến Từ Sao Kim - John Gray\nSách Hiểu Về Trái Tim - Thích Minh Niệm\nMáy xông tinh dầu tạo không gian thư giãn\nTrà dưỡng nhan sấy khô tự nhiên","productLink":""},{"stt":70,"category":"Đạo Lý Studio","title":"Video 70","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1SKEmpZMso-xYfHqrDxU5o6NL8QUG-rD2/view?usp=drivesdk","youtubeTitle":"Vì Sao Càng Nghèo Càng Hay Khoe? Nghệ Thuật Im Lặng Để Thay Đổi Vận Mệnh | Ngẫm Chuyện Đời","youtubeDesc":"Đời người hơn nhau ở cái miệng, thắng nhau ở sự tĩnh lặng. Video hôm nay sẽ chia sẻ về triết lý 'Tu Thân - Tu Khẩu' và lý do tại sao việc khoe khoang hay cầu cạnh bên ngoài chỉ khiến chúng ta thêm túng quẫn. Hãy cùng ngẫm về câu nói: 'Nghèo ở giữa chợ không ai hỏi, Giàu ở núi sâu có khách tìm' để thấy rõ bản chất của sự giàu có thực sự.\n\n#NgamChuyenDoi","tiktok":"Tại sao người nghèo càng bái Phật càng nghèo, còn người giàu lại chọn im lặng? Bí mật nằm ở hai chữ 'Khẩu Đức'. Đừng để những bức hình sống ảo che mắt thực tại. Xem hết video này để hiểu vì sao: Nghèo giữa chợ không ai hỏi, giàu núi thẳm có khách tìm. Bạn thuộc nhóm người nào?\n\n#NgamChuyenDoi","facebook":"Nghèo thích khoe, giàu chọn im lặng. Phúc đức tại miệng, vận mệnh tại tâm.\n\n#NgamChuyenDoi #BaiHocCuocSong #TuDuong #GiauNgheo #SongCham","zalo":"Gửi đến bạn lời nhắn nhủ chân tình: Đời người quý nhất là sự tĩnh lặng và tu dưỡng nội tâm. Thay vì mải mê khoe khoang những thứ hào nhoáng bên ngoài, hãy quay về vun bồi 'khẩu đức'. Chúc bạn luôn bình an, giữ tâm sáng và gặt hái được nhiều phước báu.\n\n#NgamChuyenDoi","instagram":"Tĩnh lặng là sức mạnh, khiêm tốn là đỉnh cao của sự sang trọng. Đừng để thế giới ồn ào đánh mất đi cốt cách của bạn. 🌿✨\n\n#NgamChuyenDoi #Silence #Wisdom #Mindset #LifeLessons","pinnedComment":"Theo bạn, tại sao sự im lặng lại có sức mạnh lớn hơn ngàn lời nói? Hãy để lại ý kiến của bạn bên dưới nhé! Mời cả nhà tham khảo những cuốn sách hay về tu tâm và rèn luyện tư duy tại link Bio để cùng thay đổi vận mệnh từ hôm nay. 👇","affiliateSuggestions":"Sách Sức Mạnh Của Sự Tĩnh Lặng\nSách Khéo Ăn Nói Sẽ Có Được Thiên Hạ\nSách Hiểu Về Trái Tim\nSách Bí Mật Tư Duy Triệu Phú\nSách Cổ Học Tinh Hoa","productLink":""},{"stt":71,"category":"Đạo Lý Studio","title":"Video 71","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1lLjmXuuK2Nf2AB9buaGVGs6HkFGYuPao/view?usp=drivesdk","youtubeTitle":"7 Tướng Mạo Phụ Nữ Đoán Định Sang Hèn, Cát Hung Cả Đời | Ngẫm Chuyện Đời","youtubeDesc":"Cổ nhân có câu: 'Tướng tùy tâm sinh'. Nhìn vào diện mạo, dáng đi có thể thấu hiểu phần nào vận mệnh và tính cách của một người phụ nữ. Video này chia sẻ những kinh nghiệm đúc kết của tiền nhân về tướng mạo: từ cổ cao ba ngấn đến thắt đáy lưng ong. Mong rằng mỗi người sẽ có cái nhìn sâu sắc hơn để tu tâm, dưỡng tính, từ đó thay đổi vận mệnh theo hướng tốt đẹp hơn. Hãy cùng Ngẫm Chuyện Đời chiêm nghiệm nhé!\n\n#NgamChuyenDoi","tiktok":"Tại sao ông cha ta lại nói: 'Đàn bà sạch lông, đàn ông sạch ví'? Xem hết video này để thấu hiểu những tướng mạo mang lại phú quý và những nét tướng cần tránh để cuộc đời bớt lận đận nhé!\n\n#NgamChuyenDoi","facebook":"Nhìn tướng biết ngay vận mệnh phụ nữ. Cổ cao ba ngấn, thắt đáy lưng ong là tướng đại cát, mang lại vinh hiển cho gia đình.\n\n#NgamChuyenDoi #NhanTuong #PhuNu #DaoLy #KienThuc","zalo":"Gửi chị em mình chút kiến thức về nhân tướng học của ông bà xưa. Vẻ đẹp không chỉ ở bề ngoài mà còn ẩn chứa vận mệnh. Hãy cùng chiêm nghiệm để thấu hiểu và hoàn thiện bản thân mỗi ngày nhé!\n\n#NgamChuyenDoi","instagram":"Tướng mạo là tấm gương phản chiếu tâm hồn và vận số. Bạn sở hữu nét tướng nào trong số này? ✨\n\n#NgamChuyenDoi #NhanTuong #PhuNu #PhatTrienBanThan #TriTue","pinnedComment":"Theo bạn, 'Tâm sinh tướng' hay 'Tướng định mệnh'? Hãy để lại ý kiến của mình bên dưới nhé! Để tìm hiểu sâu hơn về nghệ thuật thấu hiểu lòng người và cải thiện vận mệnh, mời cả nhà xem thêm tại link bio/giỏ hàng ạ 👇","affiliateSuggestions":"Sách Nhân Tướng Học Toàn Thư\nSách Tướng Mệnh Khảo Luận\nSách Đọc Vị Bất Kỳ Ai\nSách Cổ Học Tinh Hoa\nGương trang điểm có đèn LED cao cấp","productLink":""},{"stt":72,"category":"Đạo Lý Studio","title":"Video 72","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1AMZ_nnfjBpE6-TBdQsT5clvvRMwRyGdS/view?usp=drivesdk","youtubeTitle":"Những Điều Đại Kỵ Trong Đời Sống Cổ Nhân Luôn Nhắc Nhở Để Tránh Tai Ương | Ngẫm Chuyện Đời","youtubeDesc":"Dân gian có câu 'Có thờ có thiêng, có kiêng có lành'. Video hôm nay chia sẻ về những quy tắc ngầm trong gia đạo và đời sống: từ việc thờ cúng, phong thủy nhà ở đến những đại kỵ cần tránh trước khi đi xa hay trong ngày cưới. Hiểu đúng để tránh, làm đúng để tích phúc đức và giữ gìn bình an cho cả gia đình. Hãy cùng Ngẫm Chuyện Đời chiêm nghiệm.\n\n#NgamChuyenDoi","tiktok":"Tại sao bát hương gia tiên tuyệt đối không dùng cát? Hay vì sao trưa vắng chớ dại đứng dưới gốc đa? Những điều kiêng kỵ từ ngàn xưa chưa bao giờ là thừa. Từ cách sắp đặt cửa nhà đến việc trải chiếu ngày cưới, sơ sẩy một chút là ảnh hưởng cả vận khí gia đình. Đừng bỏ qua video này nếu bạn muốn giữ gìn phúc đức cho con cháu!\n\n#NgamChuyenDoi","facebook":"Cổ nhân dạy: Có thờ có thiêng, có kiêng có lành. Những quy tắc này bạn nhất định phải biết để gia đạo bình an.\n\n#NgamChuyenDoi #DaoLy #PhongThuy #TamLinh #BaiHoc","zalo":"Gửi cả nhà mình xem video này ạ. Những lời dạy của người xưa về cách thờ tự và kiêng kỵ trong nhà rất sâu sắc. Mình biết để giữ gìn nề nếp, mong mọi điều bình an, thuận lợi đến với gia đình mình.\n\n#NgamChuyenDoi","instagram":"Sống thuận tự nhiên, thấu hiểu quy luật nhân sinh. Những điều kiêng kỵ không phải là mê tín, mà là sự trân trọng cội nguồn và không gian sống. ✨\n\n#NgamChuyenDoi #SongCham #BinhAn #PhongThuy","pinnedComment":"Trong những điều kịch bản nhắc tới, bạn thấy điều nào cần lưu ý nhất trong cuộc sống hiện đại? Chia sẻ quan điểm của bạn phía dưới nhé! Để tìm hiểu thêm về các vật phẩm phong thủy và kiến thức gia đạo bình an, mời bạn xem thêm tại link bio/giỏ hàng của mình nhé! 👇","affiliateSuggestions":"Bột tro nếp bốc bát hương chuẩn tâm linh\nBình phong gỗ trang trí hóa giải phong thủy cửa đối cửa\nChậu cây lưỡi hổ phong thủy để trong nhà\nCặp chiếu cói dệt tay thủ công cho ngày cưới\nSách Văn khấn cổ truyền và các nghi lễ thờ cúng của người Việt","productLink":""},{"stt":73,"category":"Đạo Lý Studio","title":"Video 73","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1UMrtFWag0ai2INuSjao8jRLW9cy9FEeH/view?usp=drivesdk","youtubeTitle":"Ranh huyenDoi #BaiHocCuocDoi #HieuThao #GiaDinh #SongCham","facebook":"Đừng để thói quen vô tình làm tổn thương cha mẹ. Dù tóc bạc da mồi, họ vẫn là đấng sinh thành duy nhất.\n\n#NgamChuyenDoi #GiaDinh #DaoHieu #PhatPhap #SongDep","zalo":"Gửi những người con: Cha mẹ già đi vẫn chỉ mong nhận được sự gần gũi và tiếng gọi thân thương từ con cái. Đừng để sự vô tâm làm khoảng cách gia đình thêm xa. Chúc cả nhà một ngày bình an và tràn đầy tình yêu thương bên bố mẹ.\n\n#NgamChuyenDoi","instagram":"Mẹ cha héo mòn vẫn là mẹ cha... Hãy giữ trọn đạo hiếu và sự gần gũi khi còn có thể. ✨\n\n#NgamChuyenDoi #FamilyFirst #Vietnamese #LifeLessons #Love","pinnedComment":"Lần cuối cùng bạn ôm và gọi 'Bố, Mẹ' một cách trìu mến là khi nào? Hãy cùng chia sẻ câu chuyện của bạn để lan tỏa yêu thương nhé! Nếu bạn đang tìm kiếm những món quà sức khỏe thiết thực để báo hiếu cha mẹ, hãy ghé thăm giỏ hàng của mình tại đây nhé. 👇 #NgamChuyenDoi","affiliateSuggestions":"Máy massage cổ vai gáy cho người già\nSữa hạt dinh dưỡng dành cho người cao tuổi\nMáy đo huyết áp điện tử Microlife\nThực phẩm chức năng bổ xương khớp Glucosamine\nĐèn ngủ xông tinh dầu giúp sảng khoái tinh thần","productLink":""},{"stt":112,"category":"Đạo Lý Studio","title":"Video 112","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1QhZ0d9b8uC30Oj4Dx1bYidcn7m44NBIo/view?usp=drivesdk","youtubeTitle":"4 Loại Cây \"Chiêu Tài Tiến Bảo\" Cực Mạnh Trước Cửa Nhà | Ngẫm Chuyện Đời","youtubeDesc":"Cây xanh không chỉ mang lại không gian sống trong lành mà còn ẩn chứa những ý nghĩa phong thủy sâu sắc. Cổ nhân đã đúc kết về 4 loại cây quý nên trồng trước cửa nhà để vượng khí, xua đuổi sát khí và rước quý nhân vào nhà.\n\nTrong video này, Ngẫm Chuyện Đời sẽ chia sẻ về sức mạnh của Trúc Quan Âm, Trạng Nguyên, Cây Ngâu và Kim Giao. Bài học cuộc đời hôm nay chính là: Sự thịnh vượng và bình an bắt đầu từ chính tâm thế và không gian sống mà chúng ta chăm chút mỗi ngày. Chúc các bạn tìm được sự an yên và hanh thông trong sự nghiệp.\n\n#NgamChuyenDoi","tiktok":"Gia đình lục đục, làm mãi không dư? Có thể bạn đã bỏ lỡ \"vệ sĩ\" tài lộc ngay trước cửa nhà. Cổ nhân có dạy về 4 loại cây đặc biệt giúp hóa giải vận hạn, chiêu tài cực mạnh. Đặc biệt là loại cây thứ 4 - vật báu của vua chúa ngày xưa. Đừng lướt qua nếu bạn muốn năm nay sự nghiệp bứt phá, xem hết video để áp dụng ngay nhé!\n\n#NgamChuyenDoi","facebook":"Gia đình hưng thịnh nhờ trồng đúng 4 loại cây đại cát này trước cửa. Sự nghiệp thăng hoa, tiền tài gõ cửa.\n\n#NgamChuyenDoi #PhongThuy #CayCanh #TaiLoc #VanMay","zalo":"Gửi mọi người, chọn cây trồng trước nhà cũng là cách để đón năng lượng tích cực và bình an. 4 loại cây này không chỉ đẹp mà còn rất lành, giúp hóa giải vận hạn và chiêu tài lộc. Cả nhà tham khảo để chăm chút cho tổ ấm mình thêm vượng khí nhé!\n\n#NgamChuyenDoi","instagram":"Không gian sống là nơi nuôi dưỡng tâm hồn và vượng khí. Chọn đúng loài cây, rước trọn bình an và tài lộc. 🌱✨\n\n#NgamChuyenDoi #PhongThuy #CayCanh #Lifestyle #BinhAn","pinnedComment":"Trong 4 loại cây này, nhà bạn đã trồng cây nào chưa? Hay bạn đang tìm loại cây phù hợp nhất với không gian nhà mình? Chia sẻ bên dưới nhé! Mọi người có thể tham khảo các giống cây phong thủy và dụng cụ chăm sóc tại link bio/giỏ hàng nha. 👇","affiliateSuggestions":"Cây giống Trúc Quan Âm (Trúc Đùi Gà)\nChậu cây Trạng Nguyên phong thủy\nCây Ngâu hoa vàng giống thơm\nCây Kim Giao giống chuẩn phong thủy\nBộ dụng cụ làm vườn mini 3 món","productLink":""},{"stt":113,"category":"Đạo Lý Studio","title":"Video 113","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/12_alSJ1lpD0ZW3F22zw3MN5wDalM600n/view?usp=drivesdk","youtubeTitle":"3 Loại Thịt Tuyệt Đối KHÔNG NÊN ĂN Để Tránh Tổn Phước, Mất Lộc | Ngẫm Chuyện Đời","youtubeDesc":"Cổ nhân dạy: \"Vạn vật hữu linh\". Có những sinh vật mang linh tính cao, nếu ta vô tình xâm hại sẽ làm hao tổn phúc báo của chính mình và gia đình. Video này chia sẻ về 3 loại thịt mà người xưa khuyên nên tránh để giữ gìn vận may và sự bìn ch một người luôn bộc lộ qua những hành động vô thức nhất. Video hôm nay sẽ chia sẻ những mẹo tinh tế để thấu hiểu người đối diện: từ cách họ lái xe, đi bơi cho đến thói quen bộc lộ cảm xúc. Hãy cùng Ngẫm Chuyện Đời học cách nhìn người để chọn bạn mà chơi, chọn người mà tin cậy.\n\n#NgamChuyenDoi","tiktok":"Muốn biết lòng người nông sâu, đừng chỉ nghe lời nói, hãy nhìn cách họ hành xử. Bạn có biết tại sao đàn bà ít nói lại đáng sợ? Hay vì sao đàn ông lái xe lại lộ rõ bản chất? Video này sẽ giúp bạn 'đọc vị' bất kỳ ai trong nháy mắt. Đừng bỏ lỡ những bí mật nhân tướng học cực chuẩn này nhé!\n\n#NgamChuyenDoi","facebook":"Nhìn thấu lòng người không khó, chỉ cần bạn đủ tinh tế để quan sát những chi tiết nhỏ này.\n\n#NgamChuyenDoi #NhinNguoi #TriTue #NhanTuong #SongHien","zalo":"Gửi bạn chút chiêm nghiệm về nghệ thuật nhìn người. Đôi khi những chi tiết nhỏ nhặt nhất lại nói lên bản chất thật của một cá nhân. Chúc bạn luôn giữ được tâm thế tỉnh thức và chọn cho mình những mối quan hệ chân thành.\n\n#NgamChuyenDoi","instagram":"Thấu hiểu lòng người qua lăng kính tinh tế. Sự im lặng đôi khi là câu trả lời rõ ràng nhất cho một nhân cách. 🌿\n\n#NgamChuyenDoi #Mindfulness #LifeLessons #Philosophy #Insight","pinnedComment":"Bạn thấy nhận định 'Đàn bà ít nói trái tim thường tàn nhẫn' có đúng trong thực tế không? Chia sẻ góc nhìn của bạn nhé! Mời bạn tham khảo những cuốn sách giúp rèn luyện tâm thế và trí tuệ tại link bio nha. 👇","affiliateSuggestions":"Sách Đọc Vị Bất Kỳ Ai - David J. Lieberman\nSách Hiểu Về Trái Tim - Minh Niệm\nSách Đắc Nhân Tâm - Dale Carnegie\nSách Khéo Ăn Khéo Nói Sẽ Có Được Thiên Hạ\nSách Cổ Học Tinh Hoa - Nguyễn Hiến Lê","productLink":""},{"stt":115,"category":"Đạo Lý Studio","title":"Video 115","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1iGn4sOpflvkKT7KZpUs2Zgho-UJtEVjM/view?usp=drivesdk","youtubeTitle":"Sự Thật Trần Trụi Về Lòng Người: Chỉ Khi Chạm Đến Lợi Ích Mới Biết Ai Chân Thành | Ngẫm Chuyện Đời","youtubeDesc":"Đời người hơn nhau ở chỗ tỉnh táo. Đừng vội tin vào những lời hứa khi gió yên biển lặng, bởi chỉ khi bão tố ập đến, ta mới biết ai là người ở lại. Video hôm nay chia sẻ về những góc khuất trong bản chất con người qua các phép thử của tiền bạc, bệnh tật và hoạn nạn. Hy vọng những bài học này giúp bạn vững vàng hơn giữa nhân gian. Đừng quên Đăng ký kênh để cùng Ngẫm Chuyện Đời mỗi ngày.\n\n#NgamChuyenDoi","tiktok":"Bạn có chắc những người xung quanh thực sự tốt với mình? Đừng để đến khi trắng tay mới nhận ra bộ mặt thật. Video này sẽ giúp bạn tỉnh ngộ trước khi quá muộn. Hãy xem hết video để thấu rõ lòng người!\n\n#NgamChuyenDoi #NhanThe #BaiHocCuocDoi #ThauHieu #SongTinhThuc","facebook":"Chỉ khi hoạn nạn, lòng người mới lộ diện. Đừng nhìn bề ngoài, hãy nhìn vào bản chất.\n\n#NgamChuyenDoi #TrietLy #NhanSinh #BaiHoc #Song","zalo":"Gửi bạn, đôi khi cuộc sống cần những khoảng lặng để ta nhìn thấu lòng người. Đừng quá buồn nếu ai đó quay lưng khi ta khó khăn, đó chỉ là cách cuộc đời giúp ta lọc bỏ những điều không xứng đáng. Chúc bạn luôn vững vàng, tâm an và gặp được những chân tình thực sự.\n\n#NgamChuyenDoi","instagram":"Bản chất con người giống như một tảng băng chìm, chỉ lộ ra khi chạm vào lợi ích. Hãy sống tỉnh thức giữa nhân gian bộn bề. 🌿\n\n#NgamChuyenDoi #Mindfulness #LifeLessons #NhanSinh #TrietLySong","pinnedComment":"Trong những phép thử trên, bạn thấy phép thử nào tàn nhẫn nhất? Hãy để lại ý kiến của mình bên dưới nhé! 👇 Đừng quên ghé thăm giỏ hàng của Ngẫm Chuyện Đời để chọn những cuốn sách hay giúp nuôi dưỡng tâm hồn và trí tuệ mỗi ngày!","affiliateSuggestions":"Sách Đắc Nhân Tâm - Dale Carnegie\nSách Hiểu Về Trái Tim - Minh Niệm\nSách Tâm Lý Học Về Tiền - Morgan Housel\nSách Khéo Ăn Nói Sẽ Có Được Thiên Hạ - Trác Nhã\nSách Đời Thay Đổi Khi Chúng Ta Thay Đổi - Andrew Matthews","productLink":""},{"stt":116,"category":"Đạo Lý Studio","title":"Video 116","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1xn1mSZB_c-bqOoV7TTTKPv3JZr5r5dfd/view?usp=drive amChuyenDoi #BaiHocCuocSong #PhongThuy #TamLinh #NhanSinh","zalo":"Gửi mọi người, cuộc sống có những quy luật ngầm mà người xưa đúc kết để bảo vệ con cháu. Chút chia sẻ về những điều nên tránh để gia đình luôn bình an, thuận hòa và gặp nhiều may mắn nhé.\n\n#NgamChuyenDoi","instagram":"Họa phúc tại tâm, bình an tại đức. Những lời răn dạy của tiền nhân giúp ta sống trọn đạo làm người và tránh xa vận hạn. 🍂\n\n#NgamChuyenDoi #SongCham #TriTue #NhanSinh #BinhAn","pinnedComment":"Trong những điều kiêng kỵ trên, bạn thấy điều nào linh ứng nhất? Chia sẻ câu chuyện của bạn dưới đây nhé! Đừng quên ghé giỏ hàng để chọn những vật phẩm bình an cho gia đình mình.","affiliateSuggestions":"Sách Cổ Học Tinh Hoa\nVòng Tay Trầm Hương Tự Nhiên\nSách Muôn Kiếp Nhân Sinh\nNhang Trầm Hương Sạch\nLư Đốt Trầm Bằng Đồng","productLink":""},{"stt":149,"category":"Đạo Lý Studio","title":"Video 149","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1wQk4xy8zILiaMXId4aRCFQ7ypMmaLZzG/view?usp=drivesdk","youtubeTitle":"Đừng Để Nước Mắt Mẹ Rơi: Bài Học Thức Tỉnh Cho Những Ai Đang Vô Tâm | Ngẫm Chuyện Đời","youtubeDesc":"Giữa bão táp phong ba, chỉ có cha mẹ là bến đỗ bình yên nhất. Đừng vì những hư ảo đời thường mà quên đi những giọt mồ hôi của đấng sinh thành. Video này dành cho những ai cần một phút tĩnh lặng để nhìn lại chính mình và trân trọng cha mẹ khi còn có thể. Hãy cùng lan tỏa thông điệp này để không ai phải hối tiếc.\n\n#NgamChuyenDoi","tiktok":"Bạn có bao giờ tự hỏi cha mẹ đã hy sinh bao nhiêu để đổi lấy sự phù phiếm của bạn? Đừng để sự vô tâm giết chết đi tình thâm. Xem hết video này để thức tỉnh trước khi quá muộn.\n\n#NgamChuyenDoi","facebook":"Đừng đợi đến khi mồ yên mả đẹp mới học cách hiếu thuận. Tỉnh mộng đi thôi!\n\n#NgamChuyenDoi #daoly #nhansinh #giadinh #baohieu","zalo":"Một lời nhắc nhở nhẹ nhàng để chúng ta biết trân trọng những người yêu thương ta vô điều kiện. Cha mẹ già rồi, đừng để họ phải buồn lòng vì sự vô tâm của chúng ta bạn nhé. Gửi thông điệp này a sống nhẹ nhàng và sáng suốt hơn giữa nhân gian bộn bề. Thương chúc cả nhà bình an!\n\n#NgamChuyenDoi","instagram":"Tầm vóc của một người nằm ở cách họ đối diện với thế gian và người họ chọn để đồng hành. Đừng làm con ếch ngồi đáy giếng luận chuyện thiên hạ. ✨\n\n#NgamChuyenDoi #LifeLessons #Mindfulness #Zen #TriTue","pinnedComment":"Trong những bài học trên, bạn cảm thấy điều nào thấm thía và đúng với thực tế nhất? Hãy chia sẻ câu chuyện của bạn bên dưới để chúng ta cùng chiêm nghiệm nhé! Ngoài ra, bạn có thể tìm thêm những công cụ rèn luyện tâm thức tại link bio/giỏ hàng của mình nhé! 👇","affiliateSuggestions":"Sách Cổ Học Tinh Hoa\nSách Hiểu Về Trái Tim - Thích Minh Niệm\nTrầm hương xông nhà tự nhiên\nSách Đắc Nhân Tâm - Dale Carnegie\nBộ thẻ bài học Trí Tuệ Nhân Sinh","productLink":""},{"stt":151,"category":"Đạo Lý Studio","title":"Video 151","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1J369SA8wfR862eo2TUShp5YtMipRXyNJ/view?usp=drivesdk","youtubeTitle":"Độc Thân Là Phước Hay Họa? Sự Thật Về Nợ Duyên Và Phước Báo Tâm Linh | Ngẫm Chuyện Đời","youtubeDesc":"Trong mắt thế gian, độc thân có thể là 'ế', nhưng dưới góc nhìn tâm linh, đó là sự tự do tuyệt đối khỏi những món nợ tình từ tiền kiếp. Video này chia sẻ bài học sâu sắc về việc trân trọng thực tại, khi tâm ta không phải vướng bận những khổ đau của nhân quả tình ái. Đừng oán trách số phận, hãy hiểu rằng sự bình yên hiện tại chính là một món quà lớn lao.\n\n#NgamChuyenDoi","tiktok":"Bạn buồn vì độc thân? Có lẽ bạn đang sở hữu một phước báo cực lớn mà không biết! Độc thân thực chất là khi chúng ta không còn nợ nần ai từ kiếp trước để phải trả bằng đau khổ ở kiếp này. Xem hết video này để thấu hiểu giá trị của sự an yên và tự do thực sự nhé!\n\n#NgamChuyenDoi","facebook":"Độc thân không phải vì ế, mà là phước báo thoát khỏi nợ duyên đau khổ. Bạn có đang hưởng phước báo này?\n\n#NgamChuyenDoi #DocThan #TriTue #NhanQua #AnNhien","zalo":"Gửi bạn, người đang cảm thấy lẻ bóng: Độc thân đôi khi là một sự ưu ái của số phận, giúp ta tránh xa những khổ đau từ nợ duyên chưa dứt. Hãy sống thật an nhiên và yêu thương chính mình, bởi không nợ nần chính là phước báo lớn nhất của đời người.\n\n#NgamChuyenDoi","instagram":"Độc thân - Một hình hài khác của phước báo. Không nợ, không sầu, lòng nhẹ tựa mây bay. ✨\n\n#NgamChuyenDoi #Mindfulness #Healing #AnNhien #SelfLove","pinnedComment":"Bạn chọn sự ồn ào của nợ duyên hay sự tĩnh lặng của phước báo? Hãy để lại bình luận chia sẻ câu chuyện của bạn nhé! Ghé thăm giỏ hàng để tìm kiếm những cuốn sách và vật phẩm giúp tâm hồn thêm an yên tại đây: [Link]","affiliateSuggestions":"Sách Muôn Kiếp Nhân Sinh - Nguyên Phong\nSách Hiểu Về Trái Tim - Thích Minh Niệm\nSách Tìm Lại Chính Mình - Hòa thượng Thánh Nghiêm\nMáy xông tinh dầu gốm cao cấp\nVòng tay Trầm Hương tự nhiên","productLink":""},{"stt":152,"category":"Đạo Lý Studio","title":"Video 152","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1LhpTGHI1DChWa6mvewlJEHuCllmEus-t/view?usp=drivesdk","youtubeTitle":"Đợi Con Trả Hết Nợ Đời, Con Sẽ Về Với Mẹ Cha | Bài Học Thức Tỉnh | Ngẫm Chuyện Đời","youtubeDesc":"Phố thị dù lộng lẫy xa hoa cũng chẳng đâu bằng sự ấm áp của mái nhà xưa. Video này gửi gắm nỗi lòng của những người con xa xứ, mang theo hối hận và khát khao ngày đoàn viên. Hãy trân trọng cha mẹ và sống trọn vẹn từng phút giây. Đừng quên đăng ký kênh để cùng Ngẫm Chuyện Đời học thêm những bài học nhân sinh giá trị.\n\n#NgamChuyenDoi","tiktok":"Bạn đã bao giờ bật khóc giữa phố thị vì nhớ nhà chưa? Một thời lầm lỗi để giờ phải bôn ba trả nợ, cái giá này quả thực quá đắt. Cố gắng thêm chút nữa thôi, rồi mình về với mẹ cha. Đừng bỏ lỡ những giây cuối của video này, nó có thể là lời thức tỉnh dành cho bạn.\n\n#NgamChuyenDoi","facebook":"Phố thị xa hoa không bằng nhà mình, nơi có mẹ cha chờ đợi. Mong ngày trả hết nợ để về bên mẹ.\n\n#NgamChuyenDoi #GiaDinh #HieuThao #BaiHoc #SongCham","zalo":"Những lúc mệt mỏi nhất, nhà vẫn là nơi bình yên nhất để trở về. Đừn ừng để cả năm lộn xộn chỉ vì phạm phải 7 điều cấm kỵ đêm Giao Thừa này! Bạn có chắc mình đã làm đúng? Xem hết video để biết cách đón vận may, rước trọn bình an cho cả gia đình vào thời khắc chuyển giao năm mới nhé!\n\n#NgamChuyenDoi","facebook":"Giao thừa kiêng gì để cả năm hanh thông? Nhớ kỹ những điều này kẻo rước xui xẻo vào nhà.\n\n#NgamChuyenDoi #TetNguyenDan #GiaoThua #PhongThuy #TamLinh","zalo":"Gửi cả nhà chút lưu ý nhỏ cho đêm Giao Thừa sắp tới. Có kiêng có lành, mong rằng những lời nhắn nhủ này sẽ giúp gia đình mình có một năm mới bình an, sung túc và vạn sự như ý. Chúc mừng năm mới!\n\n#NgamChuyenDoi","instagram":"Giữ tâm sáng, thân an trong khoảnh khắc giao thừa thiêng liêng. Chút nhắc nhở để một năm mới trọn vẹn bình an và may mắn. ✨\n\n#NgamChuyenDoi #NewYear #BinhAn #TruyenThong #SongDep","pinnedComment":"Trong những điều trên, bạn thấy điều nào là khó thực hiện nhất trong đêm Giao Thừa? Hãy chia sẻ cùng Ngẫm Chuyện Đời nhé! Để chuẩn bị cho mâm cúng chỉn chu và trang hoàng nhà cửa đón Tết, mời cả nhà tham khảo các sản phẩm tinh tế tại giỏ hàng/link bio nhé! 👇","affiliateSuggestions":"Đĩa đựng gà cúng men lam Bát Tràng\nBộ nhang trầm hương sạch tự nhiên\nNước thơm lau dọn bàn thờ tinh dầu quế\nSách Phong Tục Thờ Cúng Của Người Việt\nKhăn trải bàn gấm đỏ họa tiết Tết","productLink":""},{"stt":192,"category":"Đạo Lý Studio","title":"Video 192","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1UqvBjYr6JRKUmNAw6MrmLp0EX3aLZg44/view?usp=drivesdk","youtubeTitle":"Đừng Mải Mê Theo Đuổi Phù Phiếm, Đời Người Chỉ Cần \"Vừa Đủ\" Là Bình An | Ngẫm Chuyện Đời","youtubeDesc":"Sống một kiếp người, tranh giành hơn thua rồi cũng về với cát bụi. Thay vì cố gắng có thật nhiều, hãy học cách hài lòng với những gì mình đang có. Bình an mới là phúc phần lớn nhất của đời người. Chúc bạn tìm thấy sự tự tại trong từng phút giây.\n\n#NgamChuyenDoi","tiktok":"Bạn có đang mệt mỏi vì mải mê chạy theo những thứ xa hoa? Dừng lại 1 phút để thấy đời nhẹ nhàng hơn. Video này dành cho những ai đang cảm thấy áp lực bộn bề. Xem hết để tìm lại sự bình yên trong tâm hồn nhé!\n\n#NgamChuyenDoi","facebook":"Sống ở đời, 'vừa đủ' chính là hạnh phúc lớn nhất. Đừng quá cưỡng cầu.\n\n#NgamChuyenDoi #BinhAn #SongCham #TriTue #BaiHocCuocDoi","zalo":"Gửi bạn, người đang nỗ lực mỗi ngày. Đừng quên rằng nhà giàu hay nghèo, hòa thuận là được; tiền ít hay nhiều, đủ ăn là được. Chúc bạn một ngày thật bình yên và hạnh phúc bên gia đình.\n\n#NgamChuyenDoi","instagram":"Hạnh phúc là biết đủ. Bình an là đích đến. ✨\n.\n\n#NgamChuyenDoi #Minimalism #Peace #LifeLessons #Happiness","pinnedComment":"Điều gì khiến bạn cảm thấy bình yên nhất lúc này? Chia sẻ cùng page nhé! Đừng quên ghé giỏ hàng để tìm những món đồ giúp không gian sống thêm tĩnh tại và chăm sóc sức khỏe cho cả gia đình nhé. 👇","affiliateSuggestions":"Máy xông tinh dầu phun sương\nThảm tập Yoga chống trơn trượt\nĐèn ngủ gốm sứ ánh sáng ấm\nBộ ấm chén pha trà đạo\nSổ tay ghi chép hành trình biết ơn","productLink":""},{"stt":193,"category":"Đạo Lý Studio","title":"Video 193","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1WJ7CDSZWiCfgqWEDppWVhmtAiLCAJho-/view?usp=drivesdk","youtubeTitle":"Miệng Mẹ Là Phong Thủy Của Con: 5 Bài Học Nhân Sinh Đắt Giá Cổ Nhân Để Lại | Ngẫm Chuyện Đời","youtubeDesc":"Cổ nhân dạy: 'Đường tuy gần không đi không tới, việc tuy nhẹ không làm không xong'. Video hôm nay của Ngẫm Chuyện Đời sẽ giúp bạn thấu hiểu về phong thủy gia đình, cách nhìn người qua đôi mắt, đôi chân và tầm quan trọng của việc kế thừa tri thức. Hãy cùng chiêm nghiệm để sống một cuộc đời bình an và phúc đức.\n\n#NgamChuyenDoi","tiktok":"Bạn có biết, lời nói của người mẹ chính là vận mệnh của đứa con? Tại sao có nhà giàu 3 đời, có nhà lại lụi tàn? Xem hết video này để thấu hiểu 5 quy luật nhân sinh cốt lõi giúp bạn thay đổi hoàn toàn tư duy về phúc đức và sự thành bại trong đời.\n\n#NgamChuyenDoi","facebook":"Miệng mẹ là phong thủy của con. Gia đình hưng thịnh hay suy vong đều nằm ở sự tu dưỡng và tri thức.\n\n#NgamChuyenDoi #DaoLy #NhanSinh #GiaDinh #SongTot","zalo":"Gửi cả nhà mình những lời dạy sâu sắc về đạo hiếu và cách tu dưỡng bản thân. Mong rằng mỗi chúng ta đều là bến đỗ bình yên và là phong thủy tốt nhất cho con cháu mai sau. Chúc mọi người một ngày an yên!\n\n#NgamChuyenDoi","instagram":"Tu tâm dưỡng tính, phúc đức tự thân. Miệng mẹ là phong thủy, lời nói là đóa hoa. 🌿\n.\n\n#NgamChuyenDoi #SongCham #TinhThuc #NhanSinh #AnYen","pinnedComment":"Trong những bài học trên, bạn cảm thấy tâm đắc nhất với điều nào? Hãy để lại ý kiến dưới phần bình luận nhé! Mời cả nhà ghé thăm giỏ hàng để tìm đọc những cuốn sách hay về nhân sinh tại đây: [Link Bio]","affiliateSuggestions":"Sách Cổ Học Tinh Hoa\nSách Hiểu Về Trái Tim - Minh Niệm\nSách Đắc Nhân Tâm\nTranh chữ thư pháp Phúc Đức\nVòng tay Trầm Hương tự nhiên","productLink":""},{"stt":194,"category":"Đạo Lý Studio","title":"Video 194","status":"Đã làm video","videoUrl":"https://drive.google.com/file/d/1BRHwb3u8mO6Sx4eKDZ86dqV4PeH0N4fL/view?usp=drivesdk","youtubeTitle":"Cách Nhìn Người Đoán Mệnh: Bí Mật Đằng Sau Tướng Mạo Của Mỗi Chúng Ta | Ngẫm Chuyện Đời","youtubeDesc":"Cổ nhân dạy: \"Vật có hỏng mới sinh ra dòi, người có dạ xấu mới ăn lời gièm pha\". Tướng mạo không chỉ là vẻ bề ngoài mà còn là gương soi phản chiếu tâm can và vận mệnh của một con người. Video này sẽ giúp bạn hiểu sâu hơn về những dấu hiệu nhân tướng học và bài học làm người cực kỳ sâu sắc. Hãy cùng Ngẫm Chuyện Đời chiêm nghiệm để thấu hiểu lòng người và hoàn thiện chính mình.\n\nĐừng quên nhấn Đăng ký kênh để không bỏ lỡ những bài học nhân sinh quý giá mỗi ngày!\n\n#NgamChuyenDoi","tiktok":"Bạn có biết, chỉ cần nhìn đôi mắt và khuôn mặt là có thể thấy trước hậu vận của một người? Tại sao có người lao lực cả đời, có người lại cô độc lúc xế chiều? Video này sẽ tiết lộ những bí mật về nhân tướng mà cổ nhân đã đúc kết. Đừng lướt qua nếu bạn không muốn bỏ lỡ bài học thấm thía ở cuối video!\n\n#NgamChuyenDoi","facebook":"Nhìn tướng ày sẽ giúp bạn nhận ra những giới hạn ngầm để giữ gìn phẩm giá và sự bình yên. Xem hết để không hối tiếc nhé!\n\n#NgamChuyenDoi","facebook":"Biết giới hạn để sống đời bình an. Đừng để sự thiếu hiểu biết làm mất đi phúc khí của bạn.\n\n#NgamChuyenDoi #DaoLy #NhanSinh #SongKhon #TriTue","zalo":"Gửi mọi người một chút chiêm nghiệm về những quy tắc sống của tiền nhân: '3 không hỏi, 4 không ăn, 5 không chạm'. Biết đủ, biết dừng và tôn trọng giới hạn là cách tốt nhất để giữ phúc đức và bình an cho chính mình. Chúc cả nhà một ngày tĩnh tại!\n\n#NgamChuyenDoi","instagram":"Sự tinh tế của một người nằm ở việc biết rõ những giới hạn: điều gì không nên hỏi, thứ gì không nên chạm và món gì không nên ăn. Sống điềm đạm, đời tự khắc an yên. ✨\n\n#NgamChuyenDoi #Wisdom #LifeLessons #Mindfulness #SongDep","pinnedComment":"Trong những quy tắc trên, bạn thấy điều nào là quan trọng nhất trong xã hội hiện nay? Hãy cùng chia sẻ góc nhìn bên dưới nhé! Đừng quên ghé thăm giỏ hàng của chúng mình để chọn những vật phẩm giúp tĩnh tâm và rèn luyện trí tuệ mỗi ngày.","affiliateSuggestions":"Sách Đắc Nhân Tâm (Dale Carnegie)\nSách Khéo Ăn Nói Sẽ Có Được Thiên Hạ\nSách Cổ Học Tinh Hoa\nVòng tay Trầm Hương tự nhiên\nTrà sen túi lọc cao cấp","productLink":""}];

    var currentIndex = 0;
    var currentFilter = "pending"; // MẶC ĐỊNH LUÔN LÀ CHƯA ĐĂNG THEO YÊU CẦU
    var statusSyncPending = false;
    function callPostingApi(action, params, callback) {
      if (!WEB_APP_URL || WEB_APP_URL.indexOf("https://") !== 0) { callback(new Error("Web App URL chưa được cấu hình.")); return; }
      var callbackName = "postingStatusCallback_" + Date.now() + "_" + Math.floor(Math.random() * 1000000);
      var script = document.createElement("script");
      var finished = false;
      var timeoutId = setTimeout(function() { finish(new Error("Apps Script không phản hồi.")); }, 150000);
      function finish(error, result) {
        if (finished) return;
        finished = true;
        clearTimeout(timeoutId);
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        callback(error, result);
      }
      window[callbackName] = function(result) { finish(null, result); };
      script.onerror = function() { finish(new Error("Không kết nối được Apps Script.")); };
      var query = ["action=" + encodeURIComponent(action), "callback=" + encodeURIComponent(callbackName), "_=" + Date.now()];
      Object.keys(params || {}).forEach(function(key) { query.push(encodeURIComponent(key) + "=" + encodeURIComponent(params[key])); });
      script.src = WEB_APP_URL + (WEB_APP_URL.indexOf("?") === -1 ? "?" : "&") + query.join("&");
      document.head.appendChild(script);
    }

    function getItems() {
      return currentTab === "video" ? VIDEO_ITEMS : IMAGE_ITEMS;
    }

    function getItemKey(item) {
      return currentTab + "_" + (item ? item.stt : 0);
    }

    function isDone(item) {
      return !!item && String(item.status || "").toLowerCase().indexOf("đã đăng") !== -1;
    }

    function extractDriveId(url) {
      if (!url) return "";
      var s = String(url).trim();
      var m = s.match(/\/d\/([a-zA-Z0-9_-]{25,})/);
      if (m && m[1]) return m[1];
      var m2 = s.match(/id=([a-zA-Z0-9_-]{25,})/);
      if (m2 && m2[1]) return m2[1];
      if (/^[a-zA-Z0-9_-]{25,}$/.test(s)) return s;
      return "";
    }

    function switchTab(t) {
      currentTab = t;
      document.getElementById("tabVideoBtn").classList.toggle("active", t === "video");
      document.getElementById("tabImageBtn").classList.toggle("active", t === "image");

      // Cập nhật nhãn nút Hàng 4 phù hợp với Tab
      if (t === "video") {
        document.getElementById("lblRow4Col1").innerText = "▶️ Caption YouTube";
        document.getElementById("lblRow4Col2").innerText = "📄 Mô Tả YouTube";
        document.getElementById("lblDownloadDrive").innerText = "📥 Tải Video";
        document.getElementById("previewTypeLabel").innerText = "Khung Xem Video Drive:";
      } else {
        document.getElementById("lblRow4Col1").innerText = "📸 Caption Insta";
        document.getElementById("lblRow4Col2").innerText = "🎨 Prompt AI";
        document.getElementById("lblDownloadDrive").innerText = "📥 Tải Ảnh";
        document.getElementById("previewTypeLabel").innerText = "Khung Xem Ảnh Gốc:";
      }

      // Luôn đưa về bài chưa đăng đầu tiên của tab đó
      findAndSetFirstPendingIndex();
      loadCurrentItem();
      renderTable();
      updateStats();
    }

    function findAndSetFirstPendingIndex() {
      var items = getItems();
      for (var i = 0; i < items.length; i++) {
        if (!isDone(items[i])) {
          currentIndex = i;
          return;
        }
      }
      currentIndex = 0;
    }

    function loadCurrentItem() {
      var items = getItems();
      if (!items || items.length === 0) {
        document.getElementById("currStt").innerText = "#0";
        document.getElementById("currCategory").innerText = "Chưa có dữ liệu";
        document.getElementById("currTitle").innerText = "Chưa có bài viết nào trong tab này";
        document.getElementById("previewMediaBox").innerHTML = "<div class='preview-placeholder'><span class='icon'>📁</span><span>Không có dữ liệu</span></div>";
        return;
      }

      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex >= items.length) currentIndex = items.length - 1;

      var it = items[currentIndex];
      document.getElementById("currStt").innerText = "#" + it.stt;
      document.getElementById("currCategory").innerText = it.category || "Phúc Học Điều Hay";
      document.getElementById("currTitle").innerText = it.title;

      // Cập nhật Nút Đánh Dấu Đã Đăng (Hàng 5)
      var d = isDone(it);
      var btnMark = document.getElementById("btnMarkPosted");
      var lblMark = document.getElementById("lblMarkPosted");

      if (d) {
        btnMark.className = "btn-mark-posted state-done";
        lblMark.innerText = "✅ ĐÃ ĐĂNG (Hoàn tác)";
      } else {
        btnMark.className = "btn-mark-posted state-pending";
        lblMark.innerText = "🔴 ĐÁNH DẤU: ĐÃ ĐĂNG BÀI";
      }

      // TỰ ĐỘNG NẠP VÀO KHUNG XEM TRỰC TIẾP
      renderPreviewMedia(it);
    }

    function renderPreviewMedia(it) {
      var box = document.getElementById("previewMediaBox");
      box.innerHTML = "";

      if (currentTab === "video") {
        var vidUrl = it.videoUrl || it.zipUrl || "";
        var fileId = extractDriveId(vidUrl);

        if (fileId) {
          var previewSrc = "https://drive.google.com/file/d/" + fileId + "/preview";
          var iframe = document.createElement("iframe");
          iframe.src = previewSrc;
          iframe.allow = "autoplay; fullscreen";
          iframe.setAttribute("allowfullscreen", "true");
          box.appendChild(iframe);
        } else {
          box.innerHTML = "<div class='preview-placeholder'><span class='icon'>🎬</span><b>Chưa có link video Drive</b><span class='hint'>Hãy cập nhật cột 'Link Video Drive' trong sheet</span></div>";
        }
      } else {
        // TAB ẢNH - TUYỆT ĐỐI KHÔNG DÙNG AVATAR
        var imgUrl = it.imageUrl || ("Image/A (" + it.stt + ").jpg");
        var imgId = extractDriveId(imgUrl);
        var directImgSrc = imgId ? ("https://lh3.googleusercontent.com/d/" + imgId) : imgUrl;

        var img = document.createElement("img");
        img.src = directImgSrc;
        img.title = "Nhấp để phóng to toàn màn hình";
        img.onclick = function() { openLightbox(this.src); };
        img.onerror = function() {
          if (imgId && this.src.indexOf("googleusercontent") !== -1) {
            this.src = "https://drive.google.com/thumbnail?id=" + imgId + "&sz=w1000";
          } else {
            box.innerHTML = "<div class='preview-placeholder'><span class='icon'>📸</span><b>Không thể tải trước ảnh</b><span class='hint'>Bấm 'Tải Drive' để tải ảnh gốc</span></div>";
          }
        };
        box.appendChild(img);
      }
    }

    function triggerViewInFrame() {
      var it = getItems()[currentIndex];
      if (!it) return;
      renderPreviewMedia(it);
      showToast("👁️ Đang mở trình phát trong khung xem!");
    }

    function triggerDownloadDrive() {
      var it = getItems()[currentIndex];
      if (!it) return;
      var rawUrl = (currentTab === "video") ? (it.videoUrl || it.zipUrl) : it.imageUrl;
      var fileId = extractDriveId(rawUrl);

      if (fileId) {
        var dlUrl = "https://drive.google.com/uc?export=download&id=" + fileId;
        window.open(dlUrl, "_blank");
        showToast("📥 Đang tải file từ Google Drive...");
      } else if (rawUrl && rawUrl.indexOf("http") === 0) {
        window.open(rawUrl, "_blank");
      } else {
        showToast("⚠️ Chưa có URL Google Drive cho bài này!");
      }
    }

    function openDriveExternalTab() {
      var it = getItems()[currentIndex];
      if (!it) return;
      var rawUrl = (currentTab === "video") ? (it.videoUrl || it.zipUrl) : it.imageUrl;
      if (rawUrl && rawUrl.indexOf("http") === 0) {
        window.open(rawUrl, "_blank");
      } else {
        showToast("⚠️ Chưa có đường link Google Drive!");
      }
    }

    function copyAffiliateLink() {
      if (currentTab !== "video") { showToast("⚠️ Link AFF chỉ áp dụng cho video"); return; }
      var it = getItems()[currentIndex];
      var url = it && it.productLink ? String(it.productLink).trim() : "";
      if (!/^https?:\/\//i.test(url)) { showToast("⚠️ Chưa có Link AFF cho video này"); return; }
      copyText(url, "Link AFF");
    }

    function copyAffiliateSuggestions() {
      if (currentTab !== "video") { showToast("⚠️ Gợi ý AFF chỉ áp dụng cho video"); return; }
      copyCurrentField("affiliateSuggestions", "Gợi Ý Sản Phẩm AFF");
    }

    function copyCurrentField(key, label) {
      var it = getItems()[currentIndex];
      if (!it) return;
      var txt = it[key] || "";
      if (!txt) {
        showToast("⚠️ Chưa có nội dung " + label);
        return;
      }
      copyText(txt, label);
    }

    function copyRow4Col1() {
      var it = getItems()[currentIndex];
      if (!it) return;
      if (currentTab === "video") {
        copyCurrentField("youtubeTitle", "Tiêu Đề YouTube");
      } else {
        copyCurrentField("tiktok", "Caption Instagram");
      }
    }

    function copyRow4Col2() {
      var it = getItems()[currentIndex];
      if (!it) return;
      if (currentTab === "video") {
        copyCurrentField("youtubeDesc", "Mô Tả YouTube");
      } else {
        copyCurrentField("prompt", "Prompt AI Tạo Ảnh");
      }
    }

    function nextItem() {
      var items = getItems();
      if (currentIndex < items.length - 1) {
        currentIndex++;
        loadCurrentItem();
        renderTable();
      } else {
        showToast("Đã đến bài cuối cùng!");
      }
    }

    function prevItem() {
      if (currentIndex > 0) {
        currentIndex--;
        loadCurrentItem();
        renderTable();
      } else {
        showToast("Đang ở bài đầu tiên!");
      }
    }

    function toggleCurrentDone() {
      if (statusSyncPending) return;
      var it = getItems()[currentIndex];
      if (!it) return;
      var newDone = !isDone(it);
      var button = document.getElementById("btnMarkPosted");
      statusSyncPending = true;
      if (button) button.disabled = true;
      showToast("⏳ Đang ghi trạng thái vào Google Sheet...");
      callPostingApi("markPosted", { type: currentTab, stt: String(it.stt), title: it.title || "", isDone: String(newDone) }, function(error, result) {
        statusSyncPending = false;
        if (button) button.disabled = false;
        if (error || !result || !result.success || !result.updated) {
          var syncError = result && result.error ? result.error : (error && error.message ? error.message : "Không xác nhận được trạng thái từ Google Sheet.");
          showToast("⚠️ " + syncError);
          return;
        }
        it.status = newDone ? "Đã đăng" : (currentTab === "image" ? "Đã làm ảnh" : "Đã làm video");
        if (newDone && currentFilter === "pending") findAndSetFirstPendingIndex();
        loadCurrentItem();
        renderTable();
        updateStats();
        showToast(newDone ? "✅ Sheet đã ghi: ĐÃ ĐĂNG BÀI" : "⚪ Sheet đã ghi: CHƯA ĐĂNG");
      });
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll(".filter-chip").forEach(function(c) { c.classList.remove("active"); });
      if (f === "pending") document.getElementById("chipPending").classList.add("active");
      else if (f === "done") document.getElementById("chipDone").classList.add("active");
      else document.getElementById("chipAll").classList.add("active");

      // Nếu bài hiện tại không thuộc bộ lọc mới, nhảy về bài đầu tiên thỏa mãn
      var items = getItems();
      var validIndex = -1;
      for (var i = 0; i < items.length; i++) {
        var d = isDone(items[i]);
        if (f === "all" || (f === "pending" && !d) || (f === "done" && d)) {
          validIndex = i;
          break;
        }
      }
      if (validIndex !== -1) {
        currentIndex = validIndex;
        loadCurrentItem();
      }

      renderTable();
    }

    function renderTable() {
      var q = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      var items = getItems();
      var tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      items.forEach(function(it, idx) {
        var d = isDone(it);
        if (currentFilter === "pending" && d) return;
        if (currentFilter === "done" && !d) return;

        var sttMatch = ("#" + it.stt).toLowerCase().indexOf(q) !== -1;
        var titleMatch = it.title.toLowerCase().indexOf(q) !== -1;
        if (q && !sttMatch && !titleMatch) return;

        var tr = document.createElement("tr");
        if (idx === currentIndex) tr.className = "active";
        tr.onclick = function() {
          currentIndex = idx;
          loadCurrentItem();
          renderTable();
          window.scrollTo({ top: 120, behavior: "smooth" });
        };

        tr.innerHTML = 
          '<td><b>#' + it.stt + '</b></td>' +
          '<td>' + it.title + '</td>' +
          '<td><span class="badge-status ' + (d ? "done" : "pending") + '">' + (d ? "Đã đăng" : "Chưa") + '</span></td>';
        tbody.appendChild(tr);
      });
    }

    function updateStats() {
      var items = getItems();
      var total = items.length;
      var doneCount = 0;
      var pendingCount = 0;

      items.forEach(function(it) {
        if (isDone(it)) doneCount++;
        else pendingCount++;
      });

      document.getElementById("vCount").innerText = VIDEO_ITEMS.length;
      document.getElementById("iCount").innerText = IMAGE_ITEMS.length;

      document.getElementById("countPending").innerText = pendingCount;
      document.getElementById("countDone").innerText = doneCount;
      document.getElementById("countAll").innerText = total;

      var pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
      document.getElementById("statText").innerText = "Đã đăng: " + doneCount + " / " + total;
      document.getElementById("statPercent").innerText = pct + "%";
      document.getElementById("progressBar").style.width = pct + "%";
    }

    function copyText(txt, label) {
      if (!txt) {
        showToast("⚠️ Nội dung trống");
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function() {
          showToast("✓ Đã sao chép: " + label);
        }).catch(function() {
          fallbackCopy(txt, label);
        });
      } else {
        fallbackCopy(txt, label);
      }
    }

    function fallbackCopy(txt, label) {
      var t = document.createElement("textarea");
      t.value = txt;
      t.style.position = "fixed";
      t.style.opacity = "0";
      document.body.appendChild(t);
      t.select();
      document.execCommand("copy");
      document.body.removeChild(t);
      showToast("✓ Đã sao chép: " + label);
    }

    function showToast(m) {
      var t = document.getElementById("toastMsg");
      t.innerText = m;
      t.style.display = "block";
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function() { t.style.display = "none"; }, 1800);
    }

    function openLightbox(src) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").style.display = "flex";
    }

    // KHỞI ĐỘNG MẶC ĐỊNH LÀ VIDEO & CHƯA ĐĂNG
    switchTab("video");
  </script>
</body>
</html>
